# Ultralytics YOLOv8-P2 with Semantic-Guided P2 Gated Fusion

# Parameters
nc: 80

scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]


# ============================================================
# Backbone
# ============================================================

backbone:
  # [from, repeats, module, args]

  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2

  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 3, C2f, [128, True]]       # 2-P2

  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 6, C2f, [256, True]]       # 4-P3

  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 6, C2f, [512, True]]       # 6-P4

  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 3, C2f, [1024, True]]      # 8-P5

  - [-1, 1, SPPF, [1024, 5]]        # 9


# ============================================================
# Neck + Detection Head
# ============================================================

head:

  # ----------------------------
  # P5 -> P4
  # ----------------------------

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 10

  - [[-1, 6], 1, Concat, [1]]                     # 11
  # concat backbone P4

  - [-1, 3, C2f, [512]]                           # 12


  # ----------------------------
  # P4 -> P3
  # ----------------------------

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 13

  - [[-1, 4], 1, Concat, [1]]                     # 14
  # concat backbone P3

  - [-1, 3, C2f, [256]]                           # 15
  # P3/8


  # ==========================================================
  # Proposed Semantic-Guided P2 Gated Fusion
  # ==========================================================

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]    # 16
  # P3 -> P2 resolution

  # - [[-1, 2], 1, P2GatedFusion, [2.0]]          # 17
  - [[-1, 2], 1, P2BiGatedFusion, []]             # 17
  # input:
  #   -1 : high-level P3_up
  #    2 : shallow backbone P2
  #
  # 2.0 = initial gate bias
  # sigmoid(2.0) ~= 0.88

  - [-1, 3, C2f, [128]]                           # 18
  # P2/4 xsmall detection feature


  # ----------------------------
  # P2 -> P3 PAN
  # ----------------------------

  - [-1, 1, Conv, [128, 3, 2]]                    # 19

  - [[-1, 15], 1, Concat, [1]]                    # 20

  - [-1, 3, C2f, [256]]                           # 21
  # P3/8


  # ----------------------------
  # P3 -> P4 PAN
  # ----------------------------

  - [-1, 1, Conv, [256, 3, 2]]                    # 22

  - [[-1, 12], 1, Concat, [1]]                    # 23

  - [-1, 3, C2f, [512]]                           # 24
  # P4/16


  # ----------------------------
  # P4 -> P5 PAN
  # ----------------------------

  - [-1, 1, Conv, [512, 3, 2]]                    # 25

  - [[-1, 9], 1, Concat, [1]]                     # 26

  - [-1, 3, C2f, [1024]]                          # 27
  # P5/32


  # ==========================================================
  # Four-scale detection
  # ==========================================================

  - [[18, 21, 24, 27], 1, Detect, [nc]]           # 28
  # Detect(P2, P3, P4, P5)